<!DOCTYPE html>
<html>
<head>
  <title>Personal Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Diplomata&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="navbar.js" defer></script>
</head>
<body class="home-page">
  <header>
    <div id="navbar"></div>
  </header>
 
  <div id="section1" class="section1">
    <div id="bg-layer1" class="bg-layer"></div>
    <div id="bg-layer2" class="bg-layer"></div>
    <h1>Benjamin Simmons</h1>
  </div>
 
  <!-- ABOUT ME SECTION -->
  <section id="about">
    <div class="about-inner">
 
      <!-- Photo side -->
      <div class="about-photo-wrap pixel-reveal">
        <div class="pixel-frame">
          <img src="images/self_portrait.jpeg" alt="Benjamin Simmons" id="about-photo" />
        </div>
      </div>
 
      <!-- Text side -->
      <div class="about-text">
        <h2 class="about-heading type-in">ABOUT_ME</h2>
        <div class="terminal-lines">
          <p class="terminal-line" style="--delay: 0.2s"><span class="prompt">&gt;</span> FROM: <span class="highlight">Hickory, North Carolina</span></p>
          <p class="terminal-line" style="--delay: 0.5s"><span class="prompt">&gt;</span> EDU: <span class="highlight">Clemson University</span></p>
          <p class="terminal-line" style="--delay: 0.8s"><span class="prompt">&gt;</span> DEGREE: <span class="highlight">B.S. Computer Science</span></p>
          <p class="terminal-line" style="--delay: 1.1s"><span class="prompt">&gt;</span> MINOR: <span class="highlight">Cyber Security</span></p>
          <p class="terminal-line" style="--delay: 1.4s"><span class="prompt">&gt;</span> STATUS: <span class="highlight blink">READY_TO_WORK █</span></p>
        </div>
      </div>
 
    </div>
  </section>
  <!-- CYBER SECTION -->
   <section class="cyber">
      <div class="cyber-inner">

      </div>
   </section>
 
  <script src="script.js"></script>
</body>
</html>
